services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailguard
      POSTGRES_USER: mailguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailguard -d mailguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/snifsnsort/mailguard-pro:v2.0.5
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=selfhosted
      - DATABASE_URL=postgresql://mailguard:${POSTGRES_PASSWORD}@postgres:5432/mailguard
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
